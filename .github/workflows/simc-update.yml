# Keeps SimItBoi's simc up to date, with nobody needing to act.
#
# Once a week: look at the newest Windows nightly on simulationcraft.org. Only
# if its simc version is newer than anything published before (a new revision
# or game patch, not just another day's commit), extract only simc.exe (and its
# GPL license), prove it runs, publish it gzipped as a pre-release, add it to
# the manifest, sign that, and upload both to the simc-channel release. Every
# SimItBoi install then offers the update.
#
# Actions > simc update > Run workflow starts a check by hand. Tick "any nightly"
# to take the newest nightly even when its version has not changed.
#
# Setup, once, in the repository settings:
#   - Secrets and variables > Actions > Secrets: SIMC_UPDATE_SIGNING_KEY holding
#     the whole private key file made by `npm run simc-update:keygen`.
#   - To pause updates, add the variable SIMC_UPDATES_PAUSED with value true.
#
# Runs only in the public repository, which owns the releases. Windows runner on
# purpose: it is the only place the Windows simc.exe can be run before anyone
# downloads it.
name: simc update

on:
  schedule:
    # Mondays.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      any_nightly:
        description: Take the newest nightly even if its simc version has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: simc-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'arsamezzati/SimItBoi' && vars.SIMC_UPDATES_PAUSED != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Electron itself is not needed to mirror simc; skipping its download
      # keeps the install fast.
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Mirror, sign and publish simc
        run: node scripts/simc-update/run.ts
        env:
          GH_TOKEN: ${{ github.token }}
          SIMC_UPDATE_SIGNING_KEY: ${{ secrets.SIMC_UPDATE_SIGNING_KEY }}
          SIMC_UPDATE_ANY_NIGHTLY: ${{ inputs.any_nightly && '1' || '0' }}
          # 7-Zip is preinstalled on GitHub's Windows runners.
          SEVEN_ZIP: 7z
